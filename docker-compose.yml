version: "3.9"

services:

  # ── FastAPI REST API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-sentiment-api
    ports:
      - "8000:8000"
    volumes:
      - ./models/saved_models:/app/models/saved_models:ro
      - ./results:/app/results:ro
    environment:
      - PYTHONPATH=/app/src
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - sentiment-net

  # ── Gradio Demo App ──────────────────────────────────────────────────────────
  gradio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-sentiment-gradio
    command: python app.py
    ports:
      - "7860:7860"
    volumes:
      - ./models/saved_models:/app/models/saved_models:ro
    environment:
      - PYTHONPATH=/app/src
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - sentiment-net

  # ── Ollama LLM Server ────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: hotel-sentiment-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sentiment-net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  ollama-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  sentiment-net:
    driver: bridge
